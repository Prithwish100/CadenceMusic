<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24140D"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </radialGradient>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F06A35"/>
      <stop offset="50%" stop-color="#E25822"/>
      <stop offset="100%" stop-color="#B83A0E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#E25822" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Vinyl Outer Ring -->
  <circle cx="256" cy="256" r="184" fill="#121216" stroke="#22222A" stroke-width="4"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1A1A22" stroke-width="2" stroke-dasharray="14 8"/>
  <circle cx="256" cy="256" r="136" fill="none" stroke="#1F1F28" stroke-width="2"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#272734" stroke-width="1.5" stroke-dasharray="20 12"/>

  <!-- Sunset Orange Glowing Disc Core -->
  <circle cx="256" cy="256" r="84" fill="url(#sunsetGrad)" filter="url(#glow)"/>

  <!-- Center Spindle & Audio Waves -->
  <circle cx="256" cy="256" r="26" fill="#0A0A0C"/>
  <circle cx="256" cy="256" r="8" fill="#F5F5F7"/>

  <!-- Wave bars around core -->
  <rect x="251" y="104" width="10" height="28" rx="5" fill="#E25822"/>
  <rect x="251" y="380" width="10" height="28" rx="5" fill="#E25822"/>
  <rect x="104" y="251" width="28" height="10" rx="5" fill="#E25822"/>
  <rect x="380" y="251" width="28" height="10" rx="5" fill="#E25822"/>
</svg>
