name: cadence_flutter
description: Cadence — Experimental Native Flutter Music Player (Separate Test Release)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  just_audio: ^0.9.39
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.4
  webview_flutter_wkwebview: ^3.14.0
  google_sign_in: ^6.2.1
  http: ^1.2.2
  shared_preferences: ^2.3.1
  cached_network_image: ^3.4.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
