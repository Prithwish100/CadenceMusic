plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "app.cadence.flutter.test"
    compileSdk 36

    defaultConfig {
        // Separate application ID so this experimental build installs alongside
        // the production `app.cadence.player` APK without conflict.
        applicationId "app.cadence.flutter.test"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0-exp"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/cadence-flutter-test.keystore")
            storePassword System.getenv("CADENCE_TEST_STORE_PASSWORD") ?: "cadencetest123"
            keyAlias System.getenv("CADENCE_TEST_KEY_ALIAS") ?: "cadence_flutter_test"
            keyPassword System.getenv("CADENCE_TEST_KEY_PASSWORD") ?: "cadencetest123"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android Credential Manager + Google Identity Services for Native Account Picker
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
